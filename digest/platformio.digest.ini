; Daily digest build. Copy to platformio.local.ini (gitignored) before building:
;   cp digest/platformio.digest.ini platformio.local.ini
;   DIGEST_REVISION=$(git rev-list --count <upstream tag>..HEAD) pio run -e digest
; DIGEST_REVISION numbers the digest commits on top of the CrossPoint release,
; so a digest-only fix still counts as an update (see src/DigestVersion.h).
; The digest address is not here: it goes on the SD card at /.crosspoint/digest-url.
; The device fetches the digest when it is opened, once per wake.
[env:digest]
extends = base, firmware_tuned_c3
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-digest.${sysenv.DIGEST_REVISION}\"
  -DCROSSPOINT_RELEASES_REPO=\"simonwisdom/crosspoint-digest\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DDIGEST_FETCH
